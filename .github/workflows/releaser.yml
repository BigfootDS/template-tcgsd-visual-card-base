name: Publish template ZIP
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-template
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release identity and versions
        run: node scripts/release-metadata.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Package the validated template
        run: |
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && zip -r ../example-template.zip .)
          sha256sum example-template.zip > example-template.zip.sha256
      - name: Attach the ZIP to the published release
        run: gh release upload "$RELEASE_TAG" example-template.zip example-template.zip.sha256 --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
